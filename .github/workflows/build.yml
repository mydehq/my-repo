name: Build AUR Packages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - config.json
      - builder/**
      - src/**

  schedule:
    - cron: "47 */8 * * *"

  workflow_dispatch:
    inputs:
      packages:
        description: "JSON array or space-separated package names (Leave empty for auto-detection)"
        required: false
        default: ""

  repository_dispatch:
    types: [trigger-build]

concurrency:
  group: build-packages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install System Dependencies
        run: |
          pacman -Sy --noconfirm --needed base-devel git github-cli jq python

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Configure Build User & Permissions
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          chmod +x src/install.sh

      - name: Fetch Existing Repository DB
        run: |
          BUILD_DIR=$(python3 -c "import json; print(json.load(open('config.json')).get('builder', {}).get('build-dir', 'build'))" 2>/dev/null || echo "build")
          ARCH="x86_64"

          mkdir -p "$BUILD_DIR/$ARCH"
          echo "Fetching current database index to $BUILD_DIR/$ARCH..."
          gh release download repo -D "$BUILD_DIR/$ARCH" --pattern "*.db*" --pattern "*.files*" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Package Builder
        run: |
          sed -i 's/OPTIONS=(.*debug.*/OPTIONS=(!debug)/' /etc/makepkg.conf

          # Handle input overrides
          INPUT_PKGS="${{ inputs.packages }}"
          DISPATCH_PKGS="${{ github.event.client_payload.packages }}"
          TARGET_PKGS="${INPUT_PKGS:-$DISPATCH_PKGS}"

          if [ -n "$TARGET_PKGS" ]; then
            echo "Targeted build: $TARGET_PKGS"
            export BUILD_TARGETS="$TARGET_PKGS"
          fi

          # Run Python package builder as unprivileged user
          su builder -c "python3 -m builder build"
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo/target
          GOCACHE: ${{ github.workspace }}/.go/cache
          GOMODCACHE: ${{ github.workspace }}/.go/mod

      - name: Update Database & Sync to Single Release
        id: release
        run: |
          REPO_NAME=$(python3 -c "import json; print(json.load(open('config.json')).get('meta', {}).get('repo-name', ''))" 2>/dev/null || echo "")
          BUILD_DIR=$(python3 -c "import json; print(json.load(open('config.json')).get('builder', {}).get('build-dir', 'build'))" 2>/dev/null || echo "build")
          DIST_DIR=$(python3 -c "import json; print(json.load(open('config.json')).get('builder', {}).get('dist-dir', 'dist'))" 2>/dev/null || echo "dist")
          ARCH="x86_64"

          echo "build_dir=$BUILD_DIR" >> $GITHUB_OUTPUT
          echo "dist_dir=$DIST_DIR" >> $GITHUB_OUTPUT

          # Build the website index inside the dist/ folder
          su builder -c "python3 -m builder build-index"

          cd "$BUILD_DIR/$ARCH"

          NEW_PKGS=$(ls *.pkg.tar.zst 2>/dev/null | wc -l || true)

          if [ "$NEW_PKGS" -eq 0 ]; then
            echo "No packages built. Skipping release update."
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Copy database files (replacing symlinks with actual files for GitHub Release assets)
          cp -f "${REPO_NAME}.db.tar.gz" "${REPO_NAME}.db" || true
          cp -f "${REPO_NAME}.files.tar.gz" "${REPO_NAME}.files" || true

          # Clean up superseded asset versions from the single release tag
          for new_pkg in *.pkg.tar.zst; do
            base_name=$(echo "$new_pkg" | sed -E 's/-[0-9].*//')
            echo "Removing older builds of $base_name from 'repo' release..."
            gh release view repo --json assets --jq ".assets[].name" 2>/dev/null | grep "^${base_name}-[0-9]" | grep -v "$new_pkg" | xargs -I {} gh release delete-asset repo "{}" -y || true
          done

          # Push/update the single 'repo' release
          echo "Publishing to single 'repo' GitHub Release..."
          gh release create repo ./* \
            --title "Custom Arch Repository" \
            --notes "Automated package builds and repository index" \
            --clobber
            
          echo "updated=true" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Job Summary
        if: always()
        run: |
          BUILD_DIR=$(python3 -c "import json; print(json.load(open('config.json')).get('builder', {}).get('build-dir', 'build'))" 2>/dev/null || echo "build")
          ARCH="x86_64"
          TARGET_DIR="$BUILD_DIR/$ARCH"

          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "$TARGET_DIR" ] && [ $(ls "$TARGET_DIR"/*.pkg.tar.zst 2>/dev/null | wc -l || true) -gt 0 ]; then
            echo "### Built Packages" >> $GITHUB_STEP_SUMMARY
            echo "| Package File | Size |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            for pkg in "$TARGET_DIR"/*.pkg.tar.zst; do
              [ -f "$pkg" ] || continue
              name=$(basename "$pkg")
              size=$(du -h "$pkg" | cut -f1)
              echo "| \`$name\` | $size |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No new package binaries were compiled in this run." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Setup Pages
        if: steps.release.outputs.updated == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.release.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.release.outputs.dist_dir }}

      - name: Deploy to GitHub Pages
        if: steps.release.outputs.updated == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

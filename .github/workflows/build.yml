name: Build AUR Packages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - config.yml
      - builder/**

  schedule:
    - cron: "47 */12 * * *"

  workflow_dispatch:
    inputs:
      packages:
        description: "JSON array or space-separated package names (Leave empty for auto-detection)"
        required: false
        default: ""

  repository_dispatch:
    types: [trigger-build]

concurrency:
  group: build-packages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    container:
      image: archlinux:latest

    steps:
      - name: Install System Dependencies
        run: |
          pacman -Sy --noconfirm --needed base-devel git github-cli jq

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Cache Cargo & Go
        uses: actions/cache@v6
        with:
          path: |
            .cargo/registry
            .cargo/git
            .cargo/target
            .go/cache
            .go/mod
          key: build-deps-${{ hashFiles('config.yml') }}-${{ github.run_id }}
          restore-keys: |
            build-deps-${{ hashFiles('config.yml') }}-
            build-deps-

      - name: Install my-builder
        run: |
          uv venv --python 3.14 /opt/my-builder-venv
          uv pip install --python /opt/my-builder-venv/bin/python ./builder

      - name: Configure Build User & Permissions
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "${UV_CACHE_DIR:-}" ] && [ -d "$UV_CACHE_DIR" ]; then
            chown -R builder:builder "$UV_CACHE_DIR"
          fi
          chmod +x builder/my_builder/assets/setup

      - name: Fetch Existing Repository DB
        run: |
          BUILD_DIR=$(/opt/my-builder-venv/bin/python -c "from my_builder.defaults import defaults; from my_builder.lib.config import load_config; print(load_config(defaults.config_file).repo.output_dir)" 2>/dev/null || echo "build")
          ARCH="x86_64"

          mkdir -p "$BUILD_DIR/$ARCH"
          echo "Fetching current database index to $BUILD_DIR/$ARCH..."
          gh release download repo -D "$BUILD_DIR/$ARCH" --pattern "*.db*" --pattern "*.files*" || true
          chown -R builder:builder "$BUILD_DIR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Package Builder
        run: |
          sed -i 's/OPTIONS=(.*debug.*/OPTIONS=(!debug)/' /etc/makepkg.conf

          # Handle input overrides
          INPUT_PKGS="${{ inputs.packages }}"
          DISPATCH_PKGS="${{ github.event.client_payload.packages }}"
          TARGET_PKGS="${INPUT_PKGS:-$DISPATCH_PKGS}"

          if [ -n "$TARGET_PKGS" ]; then
            echo "Targeted build: $TARGET_PKGS"
            export BUILD_TARGETS="$TARGET_PKGS"
          fi

          # Run Python package builder as unprivileged user
          su builder -c "/opt/my-builder-venv/bin/my-builder --config config.yml build"
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo/target
          GOCACHE: ${{ github.workspace }}/.go/cache
          GOMODCACHE: ${{ github.workspace }}/.go/mod

      - name: Update Database & Sync to Single Release
        id: release
        run: |
          REPO_NAME=$(/opt/my-builder-venv/bin/python -c "from my_builder.defaults import defaults; from my_builder.lib.config import load_config; print(load_config(defaults.config_file).repo.name)" 2>/dev/null || echo "")
          BUILD_DIR=$(/opt/my-builder-venv/bin/python -c "from my_builder.defaults import defaults; from my_builder.lib.config import load_config; print(load_config(defaults.config_file).repo.output_dir)" 2>/dev/null || echo "build")
          DIST_DIR=$(/opt/my-builder-venv/bin/python -c "from my_builder.defaults import defaults; from my_builder.lib.config import load_config; print(load_config(defaults.config_file).site.output_dir)" 2>/dev/null || echo "dist")

          ARCH="x86_64"

          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          echo "dist_dir=$DIST_DIR" >> "$GITHUB_OUTPUT"

          # Build the website index inside the dist/ folder
          su builder -c "CI_RUN_URL='$CI_RUN_URL' /opt/my-builder-venv/bin/my-builder --config config.yml build-index"

          cd "$BUILD_DIR/$ARCH"

          NEW_PKGS=$(find . -maxdepth 1 -type f -name '*.pkg.tar.zst' -print | wc -l)

          if [ "$NEW_PKGS" -eq 0 ]; then
            echo "No packages built. Skipping release update."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Copy database files (replacing symlinks with actual files for GitHub Release assets)
          cp -f "${REPO_NAME}.db.tar.gz" "${REPO_NAME}.db" || true
          cp -f "${REPO_NAME}.files.tar.gz" "${REPO_NAME}.files" || true

          # Clean up superseded asset versions from the single release tag
          for new_pkg in *.pkg.tar.zst; do
            base_name=$(echo "$new_pkg" | sed -E 's/-[0-9].*//')
            echo "Removing older builds of $base_name from 'repo' release..."
            gh release view repo --json assets --jq ".assets[].name" 2>/dev/null | grep "^${base_name}-[0-9]" | grep -v "$new_pkg" | xargs -I {} gh release delete-asset repo "{}" -y || true
          done

          # Push/update the single 'repo' release
          echo "Publishing to single 'repo' GitHub Release..."

          gh release create repo \
            --title "Arch Repo" \
            --notes "Automated package builds and repository index" 2>/dev/null || true

          gh release upload repo ./* --clobber
            
          echo "updated=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Generate Job Summary
        if: always()
        run: |
          BUILD_DIR=$(/opt/my-builder-venv/bin/python -c "from my_builder.defaults import defaults; from my_builder.lib.config import load_config; print(load_config(defaults.config_file).repo.output_dir)" 2>/dev/null || echo "build")

          /opt/my-builder-venv/bin/python - <<EOF
          import json, os
          from pathlib import Path

          build_dir = Path("${BUILD_DIR}")
          summary_file = build_dir / "build-summary.json"
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")

          if not step_summary:
              exit(0)

          lines = ["## Summary", ""]
          entries = []
          if summary_file.exists():
              try:
                  entries = json.loads(summary_file.read_text(encoding="utf-8"))
              except Exception:
                  entries = []

          # Fallback if summary file wasn't written but packages exist in build/x86_64
          if not entries:
              arch_dir = build_dir / "x86_64"
              if arch_dir.exists():
                  for f in sorted(arch_dir.glob("*.pkg.tar.zst")):
                      size_bytes = float(f.stat().st_size)
                      for unit in ["B", "KiB", "MiB", "GiB"]:
                          if size_bytes < 1024 or unit == "GiB":
                              size_str = f"{size_bytes:.1f} {unit}" if unit != "B" else f"{int(size_bytes)} B"
                              break
                          size_bytes /= 1024
                      entries.append({
                          "name": f.name.split("-")[0],
                          "old_version": "unknown",
                          "new_version": "unknown",
                          "filename": f.name,
                          "size": size_str,
                      })

          if entries:
              lines.append("### Built Packages")
              lines.append("")
              lines.append("| Package | Old Version | New Version | Size |")
              lines.append("| :--- | :--- | :--- | :--- |")
              for item in entries:
                  old_v = item.get("old_version", "")
                  new_v = item.get("new_version", "")
                  if old_v and old_v == new_v:
                      new_display = f"\`{new_v}\` *(rebuilt)*"
                  else:
                      new_display = f"\`{new_v}\`"
                  old_display = f"\`{old_v}\`" if old_v and old_v != "*(new)*" else "*(new)*"
                  lines.append(f"| **{item['name']}** | {old_display} | {new_display} | {item['size']} |")
          else:
              lines.append("No new package binaries were compiled in this run.")

          with open(step_summary, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          EOF

      - name: Setup Pages
        if: steps.release.outputs.updated == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.release.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.release.outputs.dist_dir }}

      - name: Deploy to GitHub Pages
        if: steps.release.outputs.updated == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

[project]
name = "my-builder"
version = "0.0.0"
description = "Build AUR packages and generate an Arch repository website"
readme = "README.md"
authors = [
    { name = "Soumadip Das", email = "soumadip+github@zohomail.in" }
]
keywords = ["aur", "archlinux", "package-builder", "repository"]

requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
my-builder = "my_builder.cli:cli"

[project.urls]
Repository = "https://github.com/mydehq/my-repo"


[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = 'my_builder'
module-root = ''
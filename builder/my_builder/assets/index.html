<!doctype html>

<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{repo_display_name}}</title>
    <meta name="description" content="{{repo_desc}}" />
    <meta name="theme-color" content="#1e1e2e" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="{{repo_name}}" />

    <!-- Local Assets -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="stylesheet" href="src/custom.css" />
  </head>

  <body>
    <!-- Top Navbar -->
    <nav class="doc-navbar">
      <div class="site-container doc-navbar-inner">
        <a class="site-brand" href="#">
          <img
            src="icon.png"
            alt="Logo"
            width="28"
            height="28"
            class="site-logo"
          />
          <span id="navbar-title">{{repo_display_name}}</span>
        </a>

        <a
          class="btn-icon source-link"
          title="Source Code"
          href="{{repo_url}}"
          target="_blank"
          aria-label="Source Code"
        >
          <svg class="site-icon" width="18" height="18" fill="currentColor">
            <use href="src/icons.svg#icon-github" />
          </svg>
        </a>
      </div>
    </nav>

    <main class="site-container site-main">
      <!-- Repo Overview Section -->
      <section id="overview" class="content-section">
        <p class="repo-description">{{repo_desc}}</p>
      </section>

      <!-- Installation Section -->
      <section id="installation" class="content-section">
        <h2 class="section-heading">Installation</h2>

        <div class="repo-config-box install-command-box" id="install-step">
          <div class="install-command no-scrollbar">{{repo_install_cmd}}</div>
          <button class="btn-icon copy-btn" aria-label="Copy command">
            <svg class="site-icon" width="16" height="16" fill="currentColor">
              <use href="src/icons.svg#icon-copy" />
            </svg>
          </button>
        </div>
      </section>

      <!-- Packages List Section -->
      <section id="packages" class="content-section">
        <div class="pkg-header-row">
          <h2 class="section-heading pkg-heading">
            Packages List
            <span class="pkg-count" title="Total packages"
              >{{repo_pkg_count}}</span
            >
          </h2>
          <div class="pkg-search-wrap">
            <button
              id="pkg-search-btn"
              class="btn-icon"
              aria-label="Search packages"
              title="Search packages (/)"
            >
              <svg class="site-icon" width="16" height="16" fill="currentColor">
                <use href="src/icons.svg#icon-search" />
              </svg>
            </button>
            <div id="pkg-search-box" class="pkg-search-box">
              <input
                type="search"
                id="pkg-search"
                class="pkg-search-input"
                placeholder="Search packages..."
                autocomplete="off"
              />
              <button
                id="pkg-search-close"
                class="btn-icon pkg-search-close"
                aria-label="Close search"
                title="Close search (Esc)"
              >
                <svg
                  class="site-icon"
                  width="14"
                  height="14"
                  fill="currentColor"
                >
                  <use href="src/icons.svg#icon-x" />
                </svg>
              </button>
            </div>
          </div>
        </div>

        <noscript>
          <div class="no-script-warning" role="alert">
            JavaScript is required to load packages and enable search and copy
            actions.
          </div>
        </noscript>

        <ul
          id="package-list"
          class="package-list"
          aria-label="Available packages"
          aria-busy="true"
        >
          <li class="package-list-state empty-msg-row">
            <svg
              class="package-state-icon"
              width="32"
              height="32"
              fill="currentColor"
            >
              <use href="src/icons.svg#icon-box" />
            </svg>
            <div>Loading packages...</div>
          </li>

          <li class="package-list-state no-results-row" style="display: none">
            <svg
              class="package-state-icon"
              width="32"
              height="32"
              fill="currentColor"
            >
              <use href="src/icons.svg#icon-search" />
            </svg>
            <div>No packages match your search</div>
          </li>

          <template id="pkg-row-template">
            <li class="pkg-row">
              <div class="pkg-info">
                <a
                  class="package-name package-name-link"
                  data-field="name"
                  target="_blank"
                  rel="noopener noreferrer"
                ></a>
                <div class="pkg-desc" data-field="description"></div>
                <div class="pkg-meta">
                  <span data-field="version"></span>
                  <span class="arch-label"
                    >(<span data-field="arch"></span>)</span
                  >
                </div>
              </div>
              <div class="pkg-actions">
                <button
                  class="btn-icon pkg-copy-btn"
                  data-field="copy"
                  type="button"
                >
                  <svg
                    class="site-icon"
                    width="14"
                    height="14"
                    fill="currentColor"
                  >
                    <use href="src/icons.svg#icon-copy" />
                  </svg>
                </button>
                <div class="package-dropdown">
                  <button
                    class="btn-icon"
                    type="button"
                    data-dropdown-toggle
                    aria-expanded="false"
                    aria-label="More package actions"
                    title="More package actions"
                  >
                    <svg
                      class="site-icon"
                      width="16"
                      height="16"
                      fill="currentColor"
                    >
                      <use href="src/icons.svg#icon-more-vertical" />
                    </svg>
                  </button>
                  <ul class="package-menu">
                    <li>
                      <a
                        class="package-menu-item"
                        data-field="download"
                        download
                      >
                        <svg
                          class="menu-item-icon"
                          width="16"
                          height="16"
                          fill="currentColor"
                          aria-hidden="true"
                        >
                          <use href="src/icons.svg#icon-download" />
                        </svg>
                        <span>Download package</span>
                      </a>
                    </li>
                    <li data-field="project-item" hidden>
                      <a
                        class="package-menu-item"
                        data-field="project"
                        target="_blank"
                        rel="noopener noreferrer"
                      >
                        <svg
                          class="menu-item-icon"
                          width="16"
                          height="16"
                          fill="currentColor"
                          aria-hidden="true"
                        >
                          <use href="src/icons.svg#icon-globe" />
                        </svg>
                        <span>Project page</span>
                      </a>
                    </li>
                  </ul>
                </div>
              </div>
            </li>
          </template>
        </ul>
      </section>
    </main>

    <!-- Footer -->
    <p class="footer-text">
      <span class="footer-label">Last updated:</span>
      <a
        id="last-updated"
        class="footer-link"
        href="{{ci_run_url}}"
        title="View CI run for {{ci_run_hash}}"
        target="_blank"
        rel="noopener noreferrer"
        >{{last_updated}}</a
      >
      | Built With
      <a class="footer-link" href="{{builder_url}}" target="_blank"
        >{{builder_name}}</a
      >
    </p>

    <!-- Scripts -->
    <script src="src/custom.js"></script>
  </body>
</html>
